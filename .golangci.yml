# golangci-lint v2. CI runs go vet + staticcheck; this config is for local use.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - unparam
  settings:
    sloglint:
      kv-only: true
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
    paths:
      - apps/.*/frontend

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bayalad7/aula
