name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc.N, published as a prerelease) builds the
# Windows apps and installers and the Linux packages (.deb, .rpm, AppImage of
# the console), tests the Linux packages on clean machines, signs one
# checksums.txt for all of them with the release key and publishes a GitHub
# release. Secrets: docs/desarrollo/publicar.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (instaladores)
    runs-on: windows-latest
    env:
      # Authenticode is optional: only when the certificate secret exists.
      HAS_CODESIGN: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no es vX.Y.Z ni vX.Y.Z-pre"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "NUMERIC_VERSION=${VERSION%%-*}" # Windows file versions are numeric
            if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=true"; else echo "PRERELEASE=false"; fi
          } >> "$GITHUB_ENV"
          echo "Versión $VERSION"

      - name: Tests
        run: go test ./...

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build the apps
        env:
          CGO_ENABLED: '0' # published binaries are built without cgo
        run: |
          mkdir -p dist/bin dist/release
          for app in teacher student; do
            sed -i "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$NUMERIC_VERSION\"/" "apps/$app/wails.json"
            (cd "apps/$app" && wails build -clean -trimpath -ldflags "-X main.version=$VERSION")
          done
          cp apps/teacher/build/bin/aula-consola.exe apps/student/build/bin/aula-cliente.exe dist/bin/

      - name: Check that the binaries report the version
        run: |
          got_console="$(dist/bin/aula-consola.exe version | tr -d '\r')"
          got_agent="$(dist/bin/aula-cliente.exe -version | tr -d '\r')"
          echo "$got_console / $got_agent"
          test "$got_console" = "aula-consola $VERSION"
          test "$got_agent" = "aula-cliente $VERSION"

      - name: Authenticode certificate
        if: env.HAS_CODESIGN == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          echo "$WINDOWS_CERT_PFX" | base64 -d > "$RUNNER_TEMP/codesign.pfx"
          signtool="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)"
          echo "SIGNTOOL=$signtool" >> "$GITHUB_ENV"

      - name: Sign the binaries (Authenticode)
        if: env.HAS_CODESIGN == 'true'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          "$SIGNTOOL" sign //f "$RUNNER_TEMP/codesign.pfx" //p "$WINDOWS_CERT_PASSWORD" \
            //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 dist/bin/*.exe

      - name: Build the installers (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Push-Location empaquetado\windows
          foreach ($iss in 'aula-alumno.iss', 'aula-consola.iss') {
            & $iscc /Q "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:NUMERIC_VERSION" `
              "/DSourceDir=..\..\dist\bin" "/O..\..\dist\release" $iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC $iss falló ($LASTEXITCODE)" }
          }
          Pop-Location

      - name: Sign the installers (Authenticode)
        if: env.HAS_CODESIGN == 'true'
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          "$SIGNTOOL" sign //f "$RUNNER_TEMP/codesign.pfx" //p "$WINDOWS_CERT_PASSWORD" \
            //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 dist/release/*.exe
          rm -f "$RUNNER_TEMP/codesign.pfx"

      - name: Portable binaries
        run: |
          cp dist/bin/aula-consola.exe "dist/release/aula-consola-$VERSION-windows-amd64.exe"
          cp dist/bin/aula-cliente.exe "dist/release/aula-cliente-$VERSION-windows-amd64.exe"
          ls -la dist/release

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  # Linux (prompt 13, capa 1). Wails needs cgo and WebKitGTK 4.1 here, so these
  # are the only binaries built with CGO_ENABLED=1 (docs/desarrollo/empaquetar-linux.md).
  linux:
    name: Linux (paquetes)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no es vX.Y.Z ni vX.Y.Z-pre"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      # The X11 parts (notice, capture, hotkey) run under Xvfb, never on a desktop.
      - name: Tests (X11 under Xvfb)
        env:
          GOFLAGS: -tags=webkit2_41
        run: xvfb-run -a dbus-run-session -- go test ./...

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build the apps
        env:
          CGO_ENABLED: '1' # Wails on Linux links GTK and WebKitGTK
        run: |
          mkdir -p dist/bin dist/release
          for app in teacher student; do
            (cd "apps/$app" && wails build -clean -trimpath -tags webkit2_41 -ldflags "-X main.version=$VERSION")
          done
          cp apps/teacher/build/bin/aula-consola apps/student/build/bin/aula-cliente dist/bin/

      - name: Check that the binaries report the version
        run: |
          test "$(dist/bin/aula-consola version)" = "aula-consola $VERSION"
          test "$(dist/bin/aula-cliente -version)" = "aula-cliente $VERSION"

      - name: Build the packages (.deb, .rpm, AppImage)
        run: bash empaquetado/linux/empaquetar.sh "$VERSION" dist/bin dist/release

      - name: Portable binaries
        run: |
          cp dist/bin/aula-consola "dist/release/aula-consola-$VERSION-linux-amd64"
          cp dist/bin/aula-cliente "dist/release/aula-cliente-$VERSION-linux-amd64"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  # Installs the .deb on a clean Ubuntu (no -dev packages, as in a lab) and the
  # .rpm on Fedora, runs both apps and removes them: the release is published
  # only if every package installs, starts and uninstalls.
  linux-instalar:
    name: Linux (instalar y quitar)
    needs: linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: paquetes

      - name: .deb and AppImage on Ubuntu 24.04
        run: bash empaquetado/linux/probar-paquetes.sh deb paquetes "${GITHUB_REF_NAME#v}"

      - name: .rpm on Fedora
        run: |
          docker run --rm -v "$PWD:/src:ro" fedora:42 \
            bash /src/empaquetado/linux/probar-paquetes.sh rpm /src/paquetes "${GITHUB_REF_NAME#v}"

  # One checksums.txt for every file of the release, signed with the release
  # key and checked against the public key in the repository before publishing.
  publicar:
    name: Firmar y publicar
    needs: [windows, linux, linux-instalar]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: checksums.txt signed with the release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          ls -la dist/release
          go run ./tools/relsign sums -o dist/release/checksums.txt dist/release/*
          go run ./tools/relsign sign -in dist/release/checksums.txt -out dist/release/checksums.txt.sig
          # Verify with the public key versioned in the repository before publishing.
          go run ./tools/relsign verify -in dist/release/checksums.txt -sig dist/release/checksums.txt.sig \
            -pub empaquetado/llave-releases.pub
          cat dist/release/checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "Aula $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/release/*

  # Etapa 13 (macOS): un job que construya el .pkg y se sume a «publicar».
