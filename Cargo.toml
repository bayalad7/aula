[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/core",
    "crates/platform",
    "crates/agent",
    "apps/console/src-tauri",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rcgen = "0.13"
rustls-pemfile = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Internal crates
aula-protocol = { path = "crates/protocol" }
aula-core = { path = "crates/core" }
aula-platform = { path = "crates/platform" }
