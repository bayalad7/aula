<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' mediastream: blob:; connect-src 'self' ws: wss:">
  <link rel="icon" href="data:,">
  <title>Aula</title>
  <link rel="stylesheet" href="sistema/tokens.css">
  <link rel="stylesheet" href="sistema/componentes.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Arriba y fijas aunque el código se desplace: la tira de identidad y las bandas. -->
  <div class="arriba">
  <!-- Tira de identidad: siempre visible (docs/privacidad.md, regla 1). -->
  <header id="estado" class="estado-conexion" data-estado="searching">
    <h1 class="solo-lector" data-t="app.titulo"></h1>
    <svg class="logo logo--sm" aria-hidden="true"><use href="sistema/iconos.svg#marca"/></svg>
    <span class="estado-conexion__punto" aria-hidden="true"></span>
    <span id="estado-texto" class="estado-conexion__texto" role="status"></span>
    <span class="estado-conexion__acciones">
      <!-- El temporizador del profesor (prompt 10.8): solo informa, sin animación; role="timer"
           no se anuncia a cada segundo. No es una banda: no observa ni controla el equipo. -->
      <span id="temporizador" class="insignia insignia--info temporizador" role="timer" hidden><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#reloj"/></svg><span id="temporizador-texto" class="cuenta"></span></span>
      <!-- Lo que hace el alumno (prompt 10.6): no quita el foco a nadie. -->
      <button type="button" id="mano" class="btn btn--sm mano-boton" aria-pressed="false"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#mano"/></svg><span id="mano-texto"></span></button>
      <button type="button" id="escribir" class="btn btn--sm" aria-expanded="false" aria-controls="redactar"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#mensaje"/></svg><span data-t="mensaje.boton"></span></button>
      <!-- Qué puede hacer Aula en este equipo (nota de interfaz 13): transparencia para el alumno. -->
      <button type="button" id="capacidades" class="btn btn--fantasma btn--icono btn--sm" aria-haspopup="dialog" aria-controls="dlg-capacidades" data-t-aria-label="capacidades.boton" data-t-title="capacidades.boton"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg></button>
      <button type="button" id="compactar" class="btn btn--fantasma btn--icono btn--sm" data-t-aria-label="ventana.compactar" data-t-title="ventana.compactar"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#contraer"/></svg></button>
    </span>
    <details id="estado-detalles" class="detalles estado-conexion__detalles" hidden>
      <summary data-t="estado.detalles"></summary>
      <pre id="estado-detalle"></pre>
    </details>
  </header>

  <!-- Bandas de transparencia: no se pueden cerrar; desaparecen cuando el profesor termina
       (docs/privacidad.md, reglas 6, 12, 20-22 y 26-28). -->
  <!-- Orden fijo: lo urgente primero (energía), después lo que el profesor hace con esta
       pantalla (control remoto, en pausa, pantalla vista, mostrada a la clase) y al final las
       restricciones. La
       transmisión del profesor lleva su banda sobre el video. Ninguna banda tiene botón para cerrarse: cada
       una desaparece sola cuando el profesor termina (prompt 19, entrega F). -->
  <div id="bandas" class="bandas">
    <section id="power" class="franja franja--urgente" role="alert" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#energia"/></svg>
      <span id="power-text" class="franja__texto"></span>
      <button type="button" id="power-postpone" class="btn btn--sm btn--sobre-color" data-t="energia.posponer" data-icono="reloj"></button>
      <span id="power-left" class="franja__nota"></span>
      <button type="button" id="power-dismiss" class="btn btn--sm btn--sobre-color" data-t="energia.entendido" hidden data-icono="hecho"></button>
    </section>
    <!-- Control remoto (reglas 37-40): después de la energía; sin botón para cerrarse ni para cortar. -->
    <p id="banda-control" class="franja franja--control" role="status" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#control"/></svg>
      <span id="banda-control-texto" class="franja__texto"></span>
    </p>
    <!-- Pantalla en pausa (reglas 9-10): después del control y antes de la pantalla vista. La
         ventana de pausa nativa cubre los monitores; esta banda queda al volver a la ventana. -->
    <p id="banda-pausa" class="franja franja--pausa" role="status" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#pausa"/></svg>
      <span id="banda-pausa-texto" class="franja__texto"></span>
    </p>
    <p id="banda-vista" class="franja franja--vista" role="status" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ojo"/></svg>
      <span id="banda-vista-texto" class="franja__texto"></span>
    </p>
    <!-- Tu pantalla mostrada a la clase (reglas 75-82): después de la pantalla vista. Sin botones:
         la decide y la termina el profesor (regla 77). -->
    <p id="banda-mostrando" class="franja franja--vista" role="status" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg>
      <span class="franja__texto" data-t="banda.mostrando"></span>
    </p>
    <section id="restrictions" class="franja franja--restricciones" role="status" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#candado"/></svg>
      <span id="restr-text" class="franja__texto"></span>
      <button type="button" id="restr-toggle" class="btn btn--sm" aria-expanded="false" aria-controls="restr-details" data-t="banda.verDetalles" data-icono="flecha-abajo"></button>
      <div id="restr-details" class="franja__detalle" hidden></div>
      <!-- Las apps que Aula cerró (regla 22): se quedan hasta que el alumno las lee. -->
      <p id="app-closed" class="franja__detalle franja__cerradas" role="alert" hidden>
        <span id="app-closed-text"></span>
        <button type="button" id="app-closed-ok" class="btn btn--sm" data-t="banda.appCerradaOk" data-icono="hecho"></button>
      </p>
    </section>
  </div>
  </div>

  <!-- Modo compacto: la ventana encogida a una tira. La pantalla vista se sigue
       viendo aquí; lo demás que hace el profesor (energía, restricciones, transmisión)
       devuelve la ventana a su tamaño. -->
  <main id="compacto" class="modo-compacto" data-t-aria-label="compacto.etiqueta" hidden>
    <h1 class="solo-lector" data-t="app.titulo"></h1>
    <svg class="logo logo--sm" aria-hidden="true"><use href="sistema/iconos.svg#marca"/></svg>
    <span id="compacto-punto" class="estado-conexion__punto" aria-hidden="true"></span>
    <span id="compacto-texto" class="modo-compacto__texto"></span>
    <span id="compacto-nuevos" class="insignia insignia--info" hidden></span>
    <span id="compacto-temporizador" class="insignia insignia--info temporizador" role="timer" hidden><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#reloj"/></svg><span id="compacto-temporizador-texto" class="cuenta"></span></span>
    <span id="compacto-control" class="insignia insignia--bloque compacto-vista" hidden><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#control"/></svg><span data-t="compacto.control"></span></span>
    <span id="compacto-pausa" class="insignia insignia--bloque compacto-vista" hidden><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#pausa"/></svg><span data-t="compacto.pausa"></span></span>
    <span id="compacto-vista" class="insignia insignia--bloque compacto-vista" hidden><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#ojo"/></svg><span data-t="compacto.vista"></span></span>
    <span id="compacto-mostrando" class="insignia insignia--bloque compacto-vista" hidden><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg><span data-t="compacto.mostrando"></span></span>
    <button type="button" id="compacto-mano" class="btn btn--sm btn--icono mano-boton" aria-pressed="false"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#mano"/></svg></button>
    <button type="button" id="compacto-escribir" class="btn btn--sm btn--icono" data-t-aria-label="mensaje.boton" data-t-title="mensaje.boton"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#mensaje"/></svg></button>
    <button type="button" id="restaurar" class="btn btn--fantasma btn--icono btn--sm" data-t-aria-label="ventana.restaurar" data-t-title="ventana.restaurar"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#expandir"/></svg></button>
  </main>

  <!-- La pantalla del profesor (docs/privacidad.md, regla 12): franja fija y conexión solo de recepción. -->
  <section id="broadcast" class="broadcast" hidden aria-labelledby="bc-notice">
    <div class="franja franja--recibiendo" role="status">
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg>
      <span class="franja__texto"><span id="bc-notice"></span> <span id="bc-modo" class="franja__nota"></span></span>
      <button type="button" id="bc-size" class="btn btn--sm btn--sobre-color" aria-pressed="false" data-t="banda.tamanoReal" data-icono="expandir"></button>
    </div>
    <div id="bc-stage" class="bc-stage" data-fit="window">
      <video id="bc-video" autoplay muted playsinline></video>
      <p id="bc-wait" class="bc-wait" data-t="banda.conectando"></p>
    </div>
  </section>

  <main id="contenido" data-t-aria-label="app.contenido">
    <!-- La mano y los mensajes al profesor (prompt 10.6): arriba de la lista. -->
    <section id="mano-estado" class="mano-estado" role="status" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#mano"/></svg>
      <span id="mano-estado-texto" class="mano-estado__texto"></span>
      <button type="button" id="motivo-abrir" class="btn btn--sm btn--fantasma" data-t="mano.agregarMotivo" hidden data-icono="mas"></button>
      <form id="motivo" class="mano-estado__motivo" hidden>
        <label class="campo"><span class="campo__etiqueta" data-t="mano.motivoEtiqueta"></span>
          <input id="motivo-texto" maxlength="140" autocomplete="off" data-icono="mano">
          <span class="campo__ayuda" data-t="mano.motivoAyuda"></span></label>
      </form>
    </section>
    <section id="enviados" class="enviados" aria-labelledby="enviados-titulo" hidden>
      <h2 id="enviados-titulo" class="enviados__titulo" data-t="mensaje.enviados"></h2>
      <ol id="enviados-lista" class="enviados__lista"></ol>
    </section>
    <!-- La clase terminó (prompt 10.14): la hora y lo que se quitó, arriba del Estado vacío, con
         «Nuevo»; nunca quita el foco. No es una banda: el alumno la cierra con «Entendido». -->
    <section id="fin-clase" class="codigo-recibido tarea" hidden tabindex="-1" aria-labelledby="fin-clase-titulo">
      <div class="codigo-recibido__cabecera">
        <div class="codigo-recibido__info">
          <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#hecho"/></svg>
          <h2 class="codigo-recibido__titulo" id="fin-clase-titulo" data-t="finClase.titulo"></h2>
          <span class="insignia insignia--conectado nuevo" id="fin-clase-nuevo" hidden></span>
          <span class="codigo-recibido__meta" id="fin-clase-hora"></span>
        </div>
        <button type="button" class="btn btn--sm" id="fin-clase-ok" data-t="finClase.entendido" data-icono="hecho"></button>
      </div>
      <p class="tarea__texto" id="fin-clase-texto"></p>
    </section>
    <div id="empty" class="vacio">
      <svg class="icono icono--xl" aria-hidden="true"><use id="vacio-icono" href="sistema/iconos.svg#codigo"/></svg>
      <h2 id="vacio-titulo"></h2>
      <p id="vacio-texto"></p>
    </div>
    <!-- Indicaciones del temporizador (nota de interfaz 18): qué hacer, arriba de la lista, con
         «Nuevo» y el tiempo; se va con el temporizador. Nunca quita el foco. -->
    <section id="tarea" class="codigo-recibido tarea" hidden tabindex="-1" aria-labelledby="tarea-titulo">
      <div class="codigo-recibido__cabecera">
        <div class="codigo-recibido__info">
          <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#reloj"/></svg>
          <h2 class="codigo-recibido__titulo" id="tarea-titulo"></h2>
          <span class="insignia insignia--conectado nuevo" id="tarea-nuevo" hidden></span>
          <span class="codigo-recibido__meta" id="tarea-tiempo"></span>
        </div>
      </div>
      <p class="tarea__texto" id="tarea-texto"></p>
    </section>
    <!-- Encuestas (prompt 10.12): la pregunta del profesor arriba de la lista, con «Nuevo». -->
    <ol id="encuestas" class="codigos" data-t-aria-label="encuestas.lista"></ol>
    <!-- Recolecciones (prompt 10.10): dónde guardar el ejercicio y qué se recogió, y cuándo. -->
    <ol id="recolecciones" class="codigos" data-t-aria-label="recolecciones.lista"></ol>
    <!-- Archivos que envió el profesor (prompt 10.9): una tarjeta por envío, con dónde quedaron. -->
    <ol id="archivos" class="codigos" data-t-aria-label="archivos.lista"></ol>
    <p id="codigos-atajo" class="codigos__atajo" data-t="codigos.atajo" hidden></p>
    <ol id="snippets" class="codigos" data-t-aria-label="codigos.lista"></ol>
    <p id="anuncio" class="solo-lector" role="status"></p>
  </main>

  <!-- Mensaje al profesor (prompt 10.6, nota de interfaz 12): su propio diálogo, que abre el alumno. -->
  <dialog class="dialogo dialogo--form" id="dlg-mensaje" aria-labelledby="redactar-titulo">
    <form id="redactar" class="dialogo__cuerpo pila" hidden>
      <div class="dialogo__titulo"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#mensaje"/></svg><h2 id="redactar-titulo" class="crece"></h2>
        <button type="button" class="btn btn--fantasma btn--icono" id="redactar-cerrar" data-t-aria-label="mensaje.cancelar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#cerrar"/></svg></button></div>
      <label class="campo"><span class="campo__etiqueta" data-t="mensaje.etiqueta"></span>
        <textarea id="redactar-texto" rows="4" maxlength="500" aria-describedby="redactar-ayuda" data-icono="mensaje"></textarea>
        <span class="campo__ayuda" id="redactar-ayuda"></span>
        <span class="campo__error" id="redactar-error" role="alert" hidden></span></label>
      <div class="grupo-botones grupo-botones--fin dialogo__pie-botones">
        <button type="button" id="redactar-cancelar" class="btn" data-t="mensaje.cancelar" data-icono="cerrar"></button>
        <button type="submit" id="redactar-enviar" class="btn btn--primario"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#enviar"/></svg><span data-t="mensaje.enviar"></span></button>
      </div>
    </form>
  </dialog>

  <!-- Qué puede hacer Aula en este equipo (nota de interfaz 13): la misma grilla que la ficha de la consola. -->
  <dialog class="dialogo dialogo--form" id="dlg-capacidades" aria-labelledby="capacidades-titulo" aria-describedby="capacidades-texto">
    <div class="dialogo__cuerpo pila">
      <div class="dialogo__titulo"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg><h2 id="capacidades-titulo" class="crece" data-t="capacidades.titulo"></h2>
        <button type="button" class="btn btn--fantasma btn--icono" id="capacidades-cerrar" data-t-aria-label="capacidades.cerrar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#cerrar"/></svg></button></div>
      <p id="capacidades-texto" data-t="capacidades.texto"></p>
      <ul class="capacidades" id="capacidades-lista"></ul>
      <p class="pequeno suave" data-t="capacidades.nota"></p>
      <div class="grupo-botones grupo-botones--fin dialogo__pie-botones">
        <button type="button" class="btn" id="capacidades-entendido" data-t="aviso.entendido" data-icono="hecho"></button>
      </div>
    </div>
  </dialog>

  <!-- Avisos del profesor: en una esquina, sin mover el código (prompt 19). -->
  <section id="avisos" class="avisos-flotantes" data-t-aria-label="aviso.region" aria-live="polite">
    <div id="notices" class="avisos"></div>
    <!-- El fin del control remoto (regla 41): lo arma la ventana al ver que terminó. -->
    <div id="control-fin" class="toast" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#control"/></svg>
      <div class="toast__texto">
        <span class="toast__titulo" data-t="control.finTitulo"></span>
        <span id="control-fin-texto"></span>
      </div>
      <button type="button" id="control-fin-ok" class="btn btn--sm" data-t="aviso.entendido" data-icono="hecho"></button>
    </div>
    <!-- El fin del temporizador (prompt 10.8): aviso suave, sin quitar el foco. -->
    <div id="temporizador-fin" class="toast" hidden>
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#reloj"/></svg>
      <div class="toast__texto">
        <span class="toast__titulo" data-t="temporizador.finTitulo"></span>
        <span id="temporizador-fin-texto"></span>
      </div>
      <button type="button" id="temporizador-fin-ok" class="btn btn--sm" data-t="aviso.entendido" data-icono="hecho"></button>
    </div>
    <button type="button" id="avisos-mas" class="btn btn--sm" hidden data-icono="mas"></button>
  </section>

  <template id="snippet-template">
    <li class="codigo-recibido">
      <div class="codigo-recibido__cabecera">
        <div class="codigo-recibido__info">
          <span class="insignia insignia--info exercise"></span>
          <h2 class="codigo-recibido__titulo title"></h2>
          <span class="insignia insignia--conectado nuevo" hidden></span>
          <span class="codigo-recibido__meta lang"></span>
        </div>
        <button type="button" class="btn btn--primario btn--sm copy"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#copiar"/></svg><span></span><span class="solo-lector"></span></button>
      </div>
      <pre class="codigo-recibido__codigo" tabindex="0"><code></code></pre>
      <p class="campo__error codigo-recibido__error" role="alert" hidden></p>
    </li>
  </template>

  <template id="archivo-template">
    <li class="codigo-recibido archivo-recibido">
      <div class="codigo-recibido__cabecera">
        <div class="codigo-recibido__info">
          <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#archivo"/></svg>
          <h2 class="codigo-recibido__titulo archivo-titulo"></h2>
          <span class="insignia insignia--conectado nuevo" hidden></span>
          <span class="codigo-recibido__meta archivo-hora"></span>
        </div>
        <button type="button" class="btn btn--sm abrir"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#carpeta"/></svg><span></span></button>
      </div>
      <div class="archivo-recibido__cuerpo">
        <p class="archivo-recibido__donde"></p>
        <ul class="archivo-recibido__lista"></ul>
        <p class="campo__error archivo-recibido__error" role="alert" hidden></p>
      </div>
    </li>
  </template>

  <template id="recoleccion-template">
    <li class="codigo-recibido archivo-recibido recoleccion">
      <div class="codigo-recibido__cabecera">
        <div class="codigo-recibido__info">
          <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#carpeta"/></svg>
          <h2 class="codigo-recibido__titulo recoleccion-titulo"></h2>
          <span class="insignia insignia--conectado nuevo" hidden></span>
          <span class="codigo-recibido__meta recoleccion-hora"></span>
        </div>
        <button type="button" class="btn btn--sm abrir"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#carpeta"/></svg><span data-t="archivo.abrir"></span></button>
      </div>
      <div class="archivo-recibido__cuerpo">
        <p class="archivo-recibido__donde recoleccion-donde"></p>
        <p class="suave recoleccion-patrones"></p>
        <p class="recoleccion-estado" role="status"></p>
        <ul class="archivo-recibido__lista recoleccion-lista"></ul>
        <p class="campo__error archivo-recibido__error" role="alert" hidden></p>
      </div>
    </li>
  </template>

  <template id="encuesta-template">
    <li class="codigo-recibido encuesta">
      <div class="codigo-recibido__cabecera">
        <div class="codigo-recibido__info">
          <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#encuesta"/></svg>
          <h2 class="codigo-recibido__titulo encuesta-titulo" data-t="encuesta.titulo"></h2>
          <span class="insignia insignia--conectado nuevo" hidden></span>
          <span class="insignia encuesta-estado-insignia"></span>
          <span class="codigo-recibido__meta encuesta-hora"></span>
        </div>
      </div>
      <form class="archivo-recibido__cuerpo encuesta-form" novalidate>
        <fieldset class="encuesta-campo">
          <legend class="encuesta-pregunta"></legend>
          <p class="suave encuesta-privacidad"></p>
          <div class="encuesta-opciones"></div>
          <label class="campo encuesta-texto" hidden><span class="campo__etiqueta" data-t="encuesta.respuestaEtiqueta"></span>
            <input type="text" maxlength="140" autocomplete="off" data-icono="editar">
            <span class="campo__ayuda encuesta-ayuda"></span></label>
        </fieldset>
        <div class="grupo-botones encuesta-botones">
          <button type="submit" class="btn btn--primario btn--sm encuesta-enviar"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#enviar"/></svg><span></span></button>
        </div>
        <p class="campo__error encuesta-error" role="alert" hidden></p>
        <p class="encuesta-voto" role="status"></p>
        <div class="encuesta-resultados" hidden>
          <h3 class="encuesta-resultados__titulo" data-t="encuesta.resultados"></h3>
          <ol class="barras"></ol>
          <p class="suave encuesta-total"></p>
        </div>
      </form>
    </li>
  </template>

  <template id="notice-template">
    <div class="toast notice">
      <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg>
      <div class="toast__texto">
        <span class="toast__titulo"></span>
        <span class="notice-text"></span>
        <span class="notice-cita" hidden></span>
      </div>
      <button type="button" class="btn btn--sm dismiss" data-icono="hecho"></button>
    </div>
  </template>
