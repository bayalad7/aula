name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      # Wails on Linux links GTK/WebKitGTK through cgo; Ubuntu 24.04 ships webkit2gtk-4.1.
      # Xvfb: the X11 tests (notice, capture, hotkey) run on a virtual screen.
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          echo "GOFLAGS=-tags=webkit2_41" >> "$GITHUB_ENV"
          echo "XVFB=xvfb-run -a" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Known vulnerabilities (Go standard library and modules) that the code
      # actually calls. Per OS, because the call graph follows the build tags
      # (*_windows.go is only analysed on Windows).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: $XVFB go test -race ./...

  # The agent as a systemd service on a real runner (D-024): installs the test
  # unit aula-agente-prueba (never aula-agente), runs its lifecycle (start,
  # crash and restart, stop, uninstall) and the root-only platform tests
  # (helper launched as another user). The last step removes the unit always.
  servicio-linux:
    name: Servicio de Linux (systemd)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo useradd -m ana

      - name: Ciclo del servicio y pruebas como root
        env:
          AULA_SERVICE_TEST: '1'
          GOFLAGS: -tags=webkit2_41
          CGO_ENABLED: '1'
        run: |
          sudo -E env "PATH=$PATH" go test -tags servicetest -run TestServiceLifecycle -v ./apps/student/
          sudo -E env "PATH=$PATH" go test -run 'TestLaunchAsTheStudent|TestServiceInstallWritesTheUnit|TestLocalChannel' -v ./internal/platform/

      - name: Quitar la unidad de prueba
        if: always()
        run: |
          sudo systemctl disable --now aula-agente-prueba.service 2>/dev/null || true
          sudo rm -f /etc/systemd/system/aula-agente-prueba.service
          sudo systemctl daemon-reload
          if systemctl cat aula-agente-prueba.service >/dev/null 2>&1; then echo "quedó la unidad de prueba"; exit 1; fi

  # The Linux packages as the release builds them (prompt 13): wails build with
  # cgo, empaquetar.sh, and the .deb installed, configured and removed on this
  # runner. A broken package shows here, not when a tag is pushed.
  linux-paquetes:
    name: Paquetes de Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the apps
        env:
          CGO_ENABLED: '1'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          mkdir -p dist/bin
          for app in teacher student; do
            (cd "apps/$app" && wails build -clean -trimpath -tags webkit2_41 -ldflags "-X main.version=0.0.0-ci")
          done
          cp apps/teacher/build/bin/aula-consola apps/student/build/bin/aula-cliente dist/bin/

      - name: Build the packages
        run: bash empaquetado/linux/empaquetar.sh 0.0.0-ci dist/bin dist/release

      - name: Install, configure and remove the .deb
        run: bash empaquetado/linux/probar-paquetes.sh deb dist/release 0.0.0-ci

  # Walks the teacher console's real frontend in headless Chromium with the
  # bindings faked (scripts/ux): fails on JS errors or serious/critical axe-core
  # violations (WCAG 2.1 AA). The screenshots are kept as an artifact.
  ux:
    name: Consola en el arnés web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ux/package-lock.json

      # The harness exports the manual with go test ./apps/teacher, which links
      # Wails (GTK/WebKitGTK) like the Go job.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "GOFLAGS=-tags=webkit2_41" >> "$GITHUB_ENV"

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # needs; allow them instead of running Chromium without a sandbox.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: npm ci
        working-directory: scripts/ux
        run: npm ci

      - name: Recorrido de la consola
        working-directory: scripts/ux
        run: node recorrido.mjs salida

      # Tab through every view (focus never lost, always visible, no traps) and
      # Esc on panels and dialogs (prompt 18, Fase 7.1).
      - name: Recorrido con el teclado
        working-directory: scripts/ux
        run: node teclado.mjs

      # Follow «Primeros pasos» as written: every control the manual names must
      # exist with that label.
      - name: Usuario nuevo (Primeros pasos)
        working-directory: scripts/ux
        run: node usuario-nuevo.mjs

      # The student app (prompt 19): every state with axe, and its behavior
      # (newest first, no jumps, keyboard, focus kept, copy errors).
      - name: Recorrido de la app del alumno
        working-directory: scripts/ux
        run: node recorrido-alumno.mjs salida-alumno

      - name: Pruebas de la app del alumno
        working-directory: scripts/ux
        run: node pruebas-alumno.mjs

      # The UI annotator (anotar.mjs): annotate one element of each app as a
      # person would and check the saved note (zone, screenshots, index).
      - name: Anotador de interfaz (autoprueba)
        working-directory: scripts/ux
        run: node anotar.mjs --prueba

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-consola
          path: |
            scripts/ux/salida/
            scripts/ux/salida-alumno/
          retention-days: 7

  # Installs a real Windows service (AulaAgentePrueba, never AulaAgente) and runs
  # its lifecycle: install, status, start, crash and automatic restart, stop,
  # uninstall (D-016). The runner is an administrator; the last step deletes the
  # service even if the test fails, so it never stays installed.
  servicio:
    name: Servicio de Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Ciclo del servicio
        env:
          AULA_SERVICE_TEST: '1'
        run: go test -tags servicetest -run TestServiceLifecycle -v ./apps/student/

      # The class restrictions change the machine (NRPT rule, browser
      # policies): only here, as administrator, and undone below.
      - name: Restricciones de la clase (NRPT, directivas y resolvedor)
        env:
          AULA_ADMIN_TEST: '1'
        # -p 1: both packages touch the same NRPT; in parallel they would see
        # each other's rule.
        run: go test -p 1 -tags admintest -run Admin -v ./internal/platform/ ./internal/policy/

      - name: Quitar las reglas NRPT de prueba
        if: always()
        shell: pwsh
        run: |
          Get-DnsClientNrptRule | Where-Object { $_.Comment -eq 'aula-filtro-web' } | ForEach-Object { Remove-DnsClientNrptRule -Name $_.Name -Force }
          if (Get-DnsClientNrptRule | Where-Object { $_.Comment -eq 'aula-filtro-web' }) { throw "quedaron reglas NRPT de Aula" }

      - name: Desinstalar el servicio de prueba
        if: always()
        shell: pwsh
        run: |
          sc.exe stop AulaAgentePrueba | Out-Null
          sc.exe delete AulaAgentePrueba | Out-Null
          if (Get-Service AulaAgentePrueba -ErrorAction SilentlyContinue) {
            Start-Sleep -Seconds 5
            if (Get-Service AulaAgentePrueba -ErrorAction SilentlyContinue) { throw "AulaAgentePrueba sigue instalado" }
          }
          exit 0
