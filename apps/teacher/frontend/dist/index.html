<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Monaco needs inline styles, its font and a same-origin worker. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss:">
  <link rel="icon" href="data:,">
  <title>Aula — Consola</title>
  <link rel="stylesheet" href="sistema/tokens.css">
  <link rel="stylesheet" href="sistema/componentes.css">
  <link rel="stylesheet" href="vendor/monaco/vs/editor/editor.main.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- Every visible text comes from textos.es-MX.js: data-t sets textContent,
     data-t-aria-label / data-t-title / data-t-placeholder set attributes. -->
<body>
  <a class="saltar" href="#contenido" data-t="comun.saltar"></a>

  <!-- Arranque: only while the class opens, or if opening failed. -->
  <main id="arranque" class="arranque" hidden aria-labelledby="arranque-titulo">
    <form id="arranque-form" class="tarjeta arranque__tarjeta" novalidate>
      <div class="arranque__marca"><svg class="icono icono--lg" aria-hidden="true"><use href="sistema/iconos.svg#codigo"/></svg><h1 id="arranque-titulo" data-t="arranque.titulo"></h1></div>
      <p id="arranque-estado" class="grupo-botones" role="status"><span class="cargador" aria-hidden="true"></span><span id="arranque-estado-texto"></span></p>
      <div id="arranque-error" class="aviso-en-linea aviso-en-linea--error" role="alert" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#error"/></svg>
        <div class="pila-mini"><strong id="arranque-error-titulo"></strong><span id="arranque-error-texto"></span>
          <details class="detalles"><summary data-t="comun.verDetalles"></summary><pre id="arranque-error-detalle"></pre></details></div>
      </div>
      <label class="campo"><span class="campo__etiqueta" data-t="arranque.canal"></span>
        <input id="arranque-canal" class="mono" inputmode="numeric" autocomplete="off" aria-describedby="arranque-canal-ayuda">
        <span class="campo__ayuda" id="arranque-canal-ayuda" data-t="arranque.canalAyuda"></span>
      </label>
      <div id="arranque-recientes" class="grupo-botones"></div>
      <label class="campo"><span class="campo__etiqueta" data-t="arranque.nombre"></span>
        <input id="arranque-nombre" maxlength="63" autocomplete="off" data-t-placeholder="arranque.nombreEjemplo">
      </label>
      <button type="submit" id="arranque-abrir" class="btn btn--primario btn--lg" data-t="arranque.abrir"></button>
      <p class="suave pequeno" id="arranque-version"></p>
    </form>
  </main>

  <div class="app" id="app" hidden>
    <nav class="nav-lateral" data-t-aria-label="nav.etiqueta">
      <div class="nav-lateral__marca"><svg class="icono icono--lg" aria-hidden="true"><use href="sistema/iconos.svg#codigo"/></svg><strong>Aula</strong></div>
      <button type="button" class="nav-lateral__clase" id="nav-clase" data-t-title="nav.cambiarCanal">
        <span class="suave" data-t="nav.claseAbierta"></span>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#flecha-abajo"/></svg>
        <strong id="nav-clase-texto"></strong>
      </button>
      <button type="button" class="nav-lateral__clase-compacta" id="nav-clase-compacta"></button>
      <p class="nav-lateral__grupo" data-t="nav.grupoClase"></p>
      <a href="#alumnos" data-vista="alumnos"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg><span class="nav-lateral__texto" data-t="nav.alumnos"></span></a>
      <a href="#codigo" data-vista="codigo"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#codigo"/></svg><span class="nav-lateral__texto" data-t="nav.codigo"></span></a>
      <p class="nav-lateral__grupo" data-t="nav.grupoPruebas"></p>
      <a href="#simulada" data-vista="simulada"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg><span class="nav-lateral__texto" data-t="nav.simulada"></span></a>
      <div class="nav-lateral__pie">
        <a href="#ayuda" data-vista="ayuda"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg><span class="nav-lateral__texto" data-t="nav.ayuda"></span></a>
        <button type="button" class="nav-lateral__boton" id="nav-ajustes"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ajustes"/></svg><span class="nav-lateral__texto" data-t="nav.ajustes"></span></button>
      </div>
    </nav>

    <div class="principal">
      <!-- Franjas globales: visibles en todas las vistas. -->
      <p class="franja franja--transmitiendo" id="f-transmitiendo" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg>
        <span class="franja__texto"><span id="f-transmitiendo-texto"></span> <span class="franja__nota" data-t="transmitir.nota"></span></span>
        <button type="button" class="btn btn--sm" id="f-transmitiendo-detener" data-t="transmitir.detener"></button>
      </p>
      <p class="franja franja--control" id="f-control" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#control"/></svg>
        <span class="franja__texto" id="f-control-texto"></span>
        <button type="button" class="btn btn--sm btn--sobre-color" id="f-control-ver" data-t="control.ver"></button>
        <button type="button" class="btn btn--sm btn--sobre-color" id="f-control-soltar" data-t="control.soltar"></button>
      </p>
      <p class="franja franja--energia" id="f-energia" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#energia"/></svg>
        <span class="franja__texto" id="f-energia-texto"></span>
        <button type="button" class="btn btn--sm" id="f-energia-cancelar" data-t="energia.cancelarPendientes"></button>
      </p>
      <p class="franja franja--simulada" id="f-simulada" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg>
        <span class="franja__texto"><span id="f-simulada-texto"></span> <span class="franja__nota" data-t="simulada.franjaNota"></span></span>
        <button type="button" class="btn btn--sm" id="f-simulada-salir" data-t="simulada.salir"></button>
      </p>
      <p class="franja franja--advertencia" id="f-clave" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#llave"/></svg>
        <span class="franja__texto" data-t="clave.sinCentro"></span>
        <button type="button" class="btn btn--sm" id="f-clave-que-hago" data-t="clave.queHago"></button>
      </p>

      <div class="con-panel">
        <main class="vista" id="contenido" tabindex="-1">

          <!-- ============ Alumnos ============ -->
          <section data-vista-de="alumnos" aria-labelledby="h-alumnos" class="vista__seccion">
            <header class="vista__cabecera">
              <h1 id="h-alumnos" data-t="alumnos.titulo"></h1>
              <div class="resumen" id="alumnos-resumen" aria-live="polite"></div>
              <div class="segmentado" role="group" data-t-aria-label="alumnos.modo">
                <button type="button" data-modo="lista"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#lista"/></svg><span data-t="alumnos.lista"></span></button>
                <button type="button" data-modo="miniaturas"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#miniaturas"/></svg><span data-t="alumnos.miniaturas"></span></button>
              </div>
              <button type="button" class="btn" id="seleccionar-todos" data-t-title="alumnos.ctrlA"><svg class="icono" aria-hidden="true"><use id="seleccionar-todos-icono" href="sistema/iconos.svg#hecho"/></svg><span class="btn__texto" id="seleccionar-todos-texto"></span></button>
              <a class="btn btn--fantasma" href="#falta"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg><span data-t="falta.titulo"></span></a>
              <button type="button" class="btn btn--fantasma btn--icono" data-ayuda-contextual data-t-aria-label="ayuda.contextual" data-t-title="ayuda.contextual"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg></button>
            </header>
            <div class="vista__cuerpo">
              <div id="alumnos-vacio" class="tarjeta vacio" hidden>
                <svg class="icono icono--xl" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg>
                <h2 id="alumnos-vacio-titulo"></h2>
                <p data-t="alumnos.vacioTexto"></p>
                <div class="grupo-botones">
                  <a class="btn btn--primario" href="#falta" data-t="falta.titulo"></a>
                  <button type="button" class="btn" data-abrir-simulada><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg><span data-t="simulada.probar"></span></button>
                </div>
              </div>
              <div id="alumnos-lista" class="tabla-adaptable">
                <table class="tabla" data-t-aria-label="alumnos.tablaEtiqueta">
                  <thead><tr>
                    <th class="col-marca"><input type="checkbox" id="alumnos-todos" data-t-aria-label="alumnos.seleccionarTodos"></th>
                    <th data-t="alumnos.colEquipo"></th><th data-t="alumnos.colEstado"></th>
                    <th data-t="alumnos.colCodigo"></th><th class="col-sistema" data-t="alumnos.colSistema"></th><th data-t="alumnos.colNotas"></th>
                    <th class="col-accion"><span class="solo-lector" data-t="alumnos.colFicha"></span></th>
                  </tr></thead>
                  <tbody id="alumnos-filas"></tbody>
                </table>
              </div>
              <div id="alumnos-miniaturas" hidden>
                <p class="aviso-en-linea aviso-en-linea--advertencia"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg><span data-t="alumnos.avisoMiniaturas"></span></p>
                <ul class="cuadricula-alumnos" id="alumnos-cuadricula"></ul>
              </div>
            </div>
            <div class="barra-acciones" role="toolbar" data-t-aria-label="alumnos.barraEtiqueta">
              <div class="barra-acciones__dentro">
                <span class="barra-acciones__seleccion" id="seleccion-texto" aria-live="polite"></span>
                <button type="button" class="btn" data-panel="pantalla" aria-expanded="false" data-t-title="panel.pantalla"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg><span class="btn__texto" data-t="panel.pantalla"></span></button>
                <button type="button" class="btn" data-panel="aviso" aria-expanded="false" data-t-title="panel.aviso"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#aviso"/></svg><span class="btn__texto" data-t="panel.aviso"></span></button>
                <button type="button" class="btn" data-panel="restricciones" aria-expanded="false" data-t-title="panel.restricciones"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#candado"/></svg><span class="btn__texto" data-t="panel.restricciones"></span></button>
                <button type="button" class="btn" data-panel="energia" aria-expanded="false" data-t-title="panel.energia"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#energia"/></svg><span class="btn__texto" data-t="panel.energia"></span></button>
                <button type="button" class="btn" data-panel="captura" aria-expanded="false" data-t-title="panel.captura"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#captura"/></svg><span class="btn__texto" data-t="panel.captura"></span></button>
              </div>
            </div>
          </section>

          <!-- ============ Código ============ -->
          <section data-vista-de="codigo" aria-labelledby="h-codigo" class="vista__seccion" hidden>
            <header class="vista__cabecera"><h1 id="h-codigo" data-t="codigo.titulo"></h1><button type="button" class="btn btn--fantasma btn--icono" data-ayuda-contextual data-t-aria-label="ayuda.contextual" data-t-title="ayuda.contextual"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg></button></header>
            <div class="vista__cuerpo pila">
              <div class="codigo-rejilla">
                <section class="tarjeta" aria-labelledby="codigo-ejercicio">
                  <div class="tarjeta__cabecera">
                    <h2 id="codigo-ejercicio"></h2>
                    <span class="insignia insignia--info"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg><span data-t="codigo.borrador"></span></span>
                  </div>
                  <div class="tarjeta__cuerpo pila">
                    <div class="fila">
                      <label class="campo crece"><span class="campo__etiqueta"><span data-t="codigo.tituloCampo"></span> <span class="suave" data-t="comun.opcional"></span></span>
                        <input id="codigo-titulo" maxlength="200" data-t-placeholder="codigo.tituloEjemplo"></label>
                      <label class="campo"><span class="campo__etiqueta" data-t="codigo.lenguaje"></span><select id="codigo-lenguaje"></select></label>
                    </div>
                    <div id="editor" class="editor" data-t-aria-label="codigo.editor"></div>
                    <p class="pequeno suave" id="codigo-ayuda-teclado"></p>
                    <fieldset class="campo">
                      <legend class="campo__etiqueta" data-t="codigo.enviarA"></legend>
                      <div class="fila">
                        <label class="opcion"><input type="radio" name="codigo-destino" value="todos" checked> <span id="codigo-destino-todos"></span></label>
                        <label class="opcion"><input type="radio" name="codigo-destino" value="seleccion" id="codigo-destino-seleccion-radio"> <span id="codigo-destino-seleccion"></span></label>
                      </div>
                    </fieldset>
                    <div class="grupo-botones">
                      <button type="button" class="btn btn--primario" id="codigo-emitir"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#enviar"/></svg><span data-t="codigo.emitir"></span></button>
                      <button type="button" class="btn" id="codigo-agregar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#mas"/></svg><span data-t="codigo.agregar"></span></button>
                      <button type="button" class="btn" id="codigo-pegar" data-t-title="codigo.pegarAyuda"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#portapapeles"/></svg><span data-t="codigo.pegar"></span></button>
                      <button type="button" class="btn btn--fantasma" id="codigo-limpiar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#limpiar"/></svg><span data-t="codigo.limpiar"></span></button>
                    </div>
                    <p class="pequeno suave" id="codigo-motivo" aria-live="polite"></p>
                  </div>
                </section>

                <section class="tarjeta tarjeta--estirada" aria-labelledby="h-envios">
                  <div class="tarjeta__cabecera"><h2 id="h-envios" data-t="codigo.envios"></h2></div>
                  <div class="tarjeta__cuerpo tarjeta__cuerpo--desplazable" tabindex="0" role="region" data-t-aria-label="codigo.enviosRegion">
                    <p class="suave pequeno" id="envios-vacio" data-t="codigo.enviosVacio"></p>
                    <ul class="lista-limpia" id="envios-lista"></ul>
                  </div>
                </section>
              </div>

              <section class="tarjeta" aria-labelledby="h-historial">
                <div class="tarjeta__cabecera"><h2 id="h-historial" data-t="codigo.historial"></h2><span class="suave pequeno" data-t="codigo.historialNota"></span></div>
                <p class="tarjeta__cuerpo suave" id="historial-vacio" data-t="codigo.historialVacio"></p>
                <div class="tabla-adaptable" id="historial-tabla">
                  <table class="tabla" aria-labelledby="h-historial">
                    <thead><tr>
                      <th data-t="codigo.colNumero"></th><th data-t="codigo.colTitulo"></th><th data-t="codigo.lenguaje"></th>
                      <th data-t="codigo.colLineas"></th><th data-t="codigo.colVeces"></th><th data-t="codigo.colHora"></th>
                      <th><span class="solo-lector" data-t="comun.acciones"></span></th>
                    </tr></thead>
                    <tbody id="historial-filas"></tbody>
                  </table>
                </div>
              </section>
            </div>
          </section>

          <!-- ============ Aula simulada ============ -->
          <section data-vista-de="simulada" aria-labelledby="h-simulada" class="vista__seccion" hidden>
            <header class="vista__cabecera"><h1 id="h-simulada" data-t="simulada.titulo"></h1><button type="button" class="btn btn--fantasma btn--icono" data-ayuda-contextual data-t-aria-label="ayuda.contextual" data-t-title="ayuda.contextual"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg></button></header>
            <div class="vista__cuerpo pila">
              <div id="simulada-cerrada" class="tarjeta vacio">
                <svg class="icono icono--xl" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg>
                <h2 data-t="simulada.vacioTitulo"></h2>
                <p data-t="simulada.vacioTexto"></p>
                <button type="button" class="btn btn--primario" data-abrir-simulada><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg><span data-t="simulada.probar"></span></button>
              </div>
              <div id="simulada-abierta" class="pila" hidden>
                <section class="tarjeta" aria-labelledby="h-sim-agregar">
                  <div class="tarjeta__cabecera"><h2 id="h-sim-agregar" data-t="simulada.agregarTitulo"></h2></div>
                  <form class="tarjeta__cuerpo fila" id="sim-form">
                    <label class="campo"><span class="campo__etiqueta" data-t="simulada.so"></span>
                      <select id="sim-so" class="control"><option value="windows">Windows</option><option value="linux">Linux</option><option value="darwin">macOS</option></select></label>
                    <fieldset class="campo"><legend class="campo__etiqueta" data-t="simulada.puede"></legend>
                      <div class="fila" id="sim-capacidades"></div></fieldset>
                    <button type="submit" class="btn btn--primario"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#mas"/></svg><span data-t="simulada.agregar"></span></button>
                  </form>
                </section>
                <section class="tarjeta" aria-labelledby="h-sim-lista">
                  <div class="tarjeta__cabecera"><h2 id="h-sim-lista" data-t="simulada.listaTitulo"></h2>
                    <button type="button" class="btn btn--sm" id="sim-cerrar" data-t="simulada.salir"></button></div>
                  <div class="tabla-adaptable">
                    <table class="tabla" aria-labelledby="h-sim-lista">
                      <thead><tr><th data-t="simulada.colAlumno"></th><th data-t="alumnos.colEstado"></th><th data-t="simulada.colPantalla"></th><th data-t="simulada.colFalla"></th><th><span class="solo-lector" data-t="comun.acciones"></span></th></tr></thead>
                      <tbody id="sim-filas"></tbody>
                    </table>
                  </div>
                </section>
              </div>
            </div>
          </section>

          <!-- ============ Ayuda: el manual (docs/v1/administracion) ============ -->
          <section data-vista-de="ayuda" aria-labelledby="h-ayuda" class="vista__seccion" hidden>
            <header class="vista__cabecera">
              <nav class="ancho-completo" id="ayuda-migas" data-t-aria-label="comun.estasEn" hidden><ol class="migas"><li><a href="#ayuda" data-t="ayuda.titulo"></a></li><li id="ayuda-migas-pagina" aria-current="page"></li></ol></nav>
              <h1 id="h-ayuda" data-t="ayuda.titulo"></h1>
              <p class="suave pequeno" data-t="ayuda.subtitulo"></p>
            </header>
            <div class="vista__cuerpo pila">
              <div class="buscador" role="search" data-t-aria-label="ayuda.buscarEtiqueta">
                <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#buscar"/></svg>
                <input type="search" id="ayuda-buscar" autocomplete="off" data-t-placeholder="ayuda.buscar" data-t-aria-label="ayuda.buscarEtiqueta">
              </div>
              <div id="ayuda-resultados" class="pila" hidden aria-live="polite">
                <h2 id="ayuda-resultados-titulo"></h2>
                <ul class="lista-limpia" id="ayuda-resultados-lista"></ul>
              </div>
              <p id="ayuda-cargando" class="grupo-botones" role="status"><span class="cargador" aria-hidden="true"></span><span data-t="ayuda.cargando"></span></p>
              <ul class="indice-manual" id="ayuda-indice"></ul>
              <article id="ayuda-pagina" class="manual tarjeta tarjeta__cuerpo" hidden></article>
            </div>
          </section>

          <!-- ============ ¿Falta un alumno? ============ -->
          <section data-vista-de="falta" aria-labelledby="h-falta" class="vista__seccion" hidden>
            <header class="vista__cabecera">
              <nav class="ancho-completo" data-t-aria-label="comun.estasEn"><ol class="migas"><li><a href="#ayuda" data-t="ayuda.titulo"></a></li><li data-t="ayuda.problemas"></li><li aria-current="page" data-t="falta.titulo"></li></ol></nav>
              <h1 id="h-falta" data-t="falta.titulo"></h1>
              <a class="btn btn--fantasma" href="#alumnos"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg><span data-t="falta.volver"></span></a>
              <button type="button" class="btn btn--fantasma btn--icono" data-ayuda-contextual data-t-aria-label="ayuda.contextual" data-t-title="ayuda.contextual"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg></button>
            </header>
            <div class="vista__cuerpo codigo-rejilla">
              <div class="pila">
              <section class="tarjeta" aria-labelledby="h-comprobar">
                <div class="tarjeta__cabecera"><h2 id="h-comprobar" data-t="comprobar.titulo"></h2></div>
                <div class="tarjeta__cuerpo pila">
                  <p class="pequeno suave" data-t="comprobar.ayuda"></p>
                  <div class="grupo-botones">
                    <button type="button" class="btn btn--sm" id="comprobar-iniciar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#red"/></svg><span data-t="comprobar.iniciar"></span></button>
                  </div>
                  <p id="comprobar-estado" role="status"></p>
                  <ol class="pasos" id="comprobar-pasos" hidden></ol>

      <button type="button" class="btn" id="cap-abrir" hidden><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#carpeta"/></svg><span data-t="captura.abrirCarpeta"></span></button>
      <button type="button" class="btn btn--primario" id="cap-guardar" disabled><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#guardar"/></svg><span data-t="captura.guardar"></span></button>
      <button type="button" class="btn btn--primario" id="cap-listo" data-cerrar-dialogo data-t="captura.listo" hidden></button>
    </div>
  </dialog>

  <dialog class="modal-ajustes" id="ajustes" aria-labelledby="aj-titulo">
    <div class="modal-ajustes__lado">
      <h2 id="aj-titulo" data-t="nav.ajustes"></h2>
      <div class="modal-ajustes__pestanas" role="tablist" aria-orientation="vertical" aria-labelledby="aj-titulo">
        <button type="button" role="tab" id="tab-clase" aria-controls="aj-clase" aria-selected="true"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg><span data-t="ajustes.clase"></span></button>
        <button type="button" role="tab" id="tab-apariencia" aria-controls="aj-apariencia" aria-selected="false" tabindex="-1"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#sol"/></svg><span data-t="ajustes.apariencia"></span></button>
        <button type="button" role="tab" id="tab-acerca" aria-controls="aj-acerca" aria-selected="false" tabindex="-1"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg><span data-t="ajustes.acerca"></span></button>
      </div>
    </div>
    <div class="modal-ajustes__contenido">
      <button type="button" class="btn btn--fantasma btn--icono modal-ajustes__cerrar" data-cerrar-dialogo data-t-aria-label="ajustes.cerrar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#cerrar"/></svg></button>
      <section role="tabpanel" id="aj-clase" aria-labelledby="tab-clase">
        <h3 data-t="ajustes.clase"></h3>
        <div class="ajuste">
          <div class="ajuste__texto"><strong id="aj-nombre"></strong><span data-t="ajustes.nombreAyuda"></span></div>
          <button type="button" class="btn" id="aj-cambiar-nombre" data-t="comun.cambiar"></button>
        </div>
        <div class="ajuste">
          <div class="ajuste__texto"><span class="con-info"><strong id="aj-canal"></strong><button type="button" class="info-boton" data-info="canal" aria-expanded="false"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg></button></span><span data-t="ajustes.canalAyuda"></span></div>
          <button type="button" class="btn" id="aj-cambiar-canal" data-t="comun.cambiar"></button>
        </div>
        <div class="ajuste">
          <div class="ajuste__texto"><strong data-t="ajustes.canalInicio"></strong><span data-t="ajustes.canalInicioAyuda"></span></div>
          <span class="insignia" id="aj-canal-inicio"></span>
        </div>
      </section>
      <section role="tabpanel" id="aj-apariencia" aria-labelledby="tab-apariencia" hidden>
        <h3 data-t="ajustes.apariencia"></h3>
        <div class="ajuste">
          <div class="ajuste__texto"><strong data-t="ajustes.tema"></strong><span data-t="ajustes.temaAyuda"></span></div>
          <div class="opciones-tarjeta ajuste__ancho" role="radiogroup" data-t-aria-label="ajustes.tema">
            <button type="button" class="opcion-tarjeta" role="radio" data-tema="sistema"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ajustes"/></svg><span data-t="ajustes.temaSistema"></span></button>
            <button type="button" class="opcion-tarjeta" role="radio" data-tema="light"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#sol"/></svg><span data-t="ajustes.temaClaro"></span></button>
            <button type="button" class="opcion-tarjeta" role="radio" data-tema="dark"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#luna"/></svg><span data-t="ajustes.temaOscuro"></span></button>
          </div>
        </div>
      </section>
      <section role="tabpanel" id="aj-acerca" aria-labelledby="tab-acerca" hidden>
        <h3 data-t="ajustes.acerca"></h3>
        <div class="ajuste"><div class="ajuste__texto"><strong data-t="ajustes.version"></strong><span id="aj-version"></span></div></div>
        <div class="ajuste">
          <div class="ajuste__texto"><span class="con-info"><strong id="aj-clave-titulo"></strong><button type="button" class="info-boton" data-info="clave" aria-expanded="false"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg></button></span><span id="aj-clave-texto"></span></div>
          <span class="insignia" id="aj-clave"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#llave"/></svg><span class="mono" id="aj-clave-huella"></span></span>
        </div>
        <div class="ajuste">
          <div class="ajuste__texto"><span class="con-info"><strong data-t="ajustes.certificado"></strong><button type="button" class="info-boton" data-info="certificado" aria-expanded="false"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg></button></span><span id="aj-certificado"></span></div>
        </div>
        <div class="ajuste">
          <div class="ajuste__texto"><strong data-t="ajustes.atajo"></strong><span id="aj-atajo"></span></div>
        </div>
        <div class="ajuste">
          <div class="ajuste__texto"><strong data-t="ajustes.capturas"></strong><span data-t="ajustes.capturasAyuda"></span>
            <span class="ruta mono pequeno" id="aj-capturas-ruta"></span><span class="pequeno suave" id="aj-capturas-nota" data-t="ajustes.capturasNoExiste" hidden></span></div>
          <button type="button" class="btn" id="aj-capturas-abrir"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#carpeta"/></svg><span data-t="captura.abrirCarpeta"></span></button>
        </div>
        <div class="ajuste">
          <div class="ajuste__texto"><span class="con-info"><strong data-t="instalador.titulo"></strong><button type="button" class="info-boton" data-info="puertos" aria-expanded="false"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg></button></span><span data-t="instalador.ayuda"></span></div>
          <div class="bloque-codigo ajuste__ancho">
            <div class="bloque-codigo__cabecera"><span data-t="instalador.estaConsola"></span>
              <button type="button" class="btn btn--fantasma btn--sm" data-copiar="aj-datos"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#copiar"/></svg><span data-t="comun.copiar"></span></button></div>
            <pre id="aj-datos"></pre>
          </div>
        </div>
      </section>
    </div>
  </dialog>

  <div class="avisos-flotantes" id="avisos" aria-live="polite"></div>

  <!-- ============ Plantillas ============ -->
  <template id="t-fila-alumno">
    <tr>
      <td class="col-marca"><input type="checkbox" class="marca"></td>
      <td class="celda-principal" data-t-etiqueta="alumnos.colEquipo"><span class="equipo"></span><span class="celda-sub usuario"></span></td>
      <td data-t-etiqueta="alumnos.colEstado" class="estado"></td>
      <td data-t-etiqueta="alumnos.colCodigo" class="codigo"></td>
      <td data-t-etiqueta="alumnos.colSistema" class="sistema col-sistema"><span class="so"></span><span class="celda-sub version"></span></td>
      <td data-t-etiqueta="alumnos.colNotas" class="notas"></td>
      <td class="col-accion"><button type="button" class="btn btn--fantasma btn--icono btn--sm ficha"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg></button></td>
    </tr>
  </template>
  <template id="t-tarjeta-alumno">
    <li class="alumno">
      <input class="alumno__marca marca" type="checkbox">
      <button type="button" class="alumno__pantalla"><img alt=""><span class="alumno__pantalla-texto"></span></button>
      <div class="alumno__pie"><span class="alumno__nombre"></span><span class="estado"></span></div>
      <div class="alumno__sub"></div>
    </li>
  </template>
  <template id="t-envio">
    <li class="envio">
      <div class="envio__cabecera"><strong class="envio__titulo"></strong><span class="envio__conteo"></span></div>
      <button type="button" class="btn btn--fantasma btn--sm envio__desplegar" aria-expanded="false"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#flecha-abajo"/></svg><span></span></button>
      <dl class="desglose" hidden></dl>
      <div class="grupo-botones envio__acciones" hidden><button type="button" class="btn btn--sm envio__reenviar"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#reenviar"/></svg><span></span></button></div>
    </li>
  </template>
  <template id="t-historial">
    <tr>
      <td class="num"></td><td class="celda-principal titulo"></td><td class="lenguaje"></td><td class="lineas"></td><td class="veces"></td><td class="hora"></td>
      <td><div class="grupo-botones grupo-botones--fin">
        <button type="button" class="btn btn--sm abrir"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#editar"/></svg><span></span></button>
        <button type="button" class="btn btn--sm reemitir"></button></div></td>
    </tr>
  </template>
  <template id="t-lote-captura">
    <li class="lote-captura">
      <input type="checkbox" class="marca" checked>
      <span class="lote-captura__mini"><img alt=""></span>
      <span class="lote-captura__texto"><strong class="equipo"></strong><span class="pequeno estado"></span></span>
      <button type="button" class="btn btn--fantasma btn--sm ver" hidden></button>
    </li>
  </template>
  <template id="t-fila-simulado">
    <tr>
      <td class="celda-principal"><span class="nombre"></span><span class="celda-sub detalle"></span></td>
      <td class="estado"></td>
      <td class="pantalla"></td>
      <td><select class="falla control control--sm"></select></td>
      <td><button type="button" class="btn btn--sm btn--fantasma quitar"></button></td>
    </tr>
  </template>

  <script src="events.js"></script>
  <script src="textos.es-MX.js"></script>
  <script src="vendor/monaco/vs/loader.js"></script>
  <script src="main.js"></script>
</body>
</html>
