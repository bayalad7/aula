<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Monaco needs inline styles, its font and a same-origin worker. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws: wss:">
  <link rel="icon" href="data:,">
  <title>Aula — Consola</title>
  <link rel="stylesheet" href="sistema/tokens.css">
  <link rel="stylesheet" href="sistema/componentes.css">
  <link rel="stylesheet" href="vendor/monaco/vs/editor/editor.main.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- Every visible text comes from textos.es-MX.js: data-t sets textContent,
     data-t-aria-label / data-t-title / data-t-placeholder set attributes. -->
<body>
  <a class="saltar" href="#contenido" data-t="comun.saltar"></a>

  <!-- Arranque: only while the class opens, or if opening failed. -->
  <main id="arranque" class="arranque" hidden aria-labelledby="arranque-titulo">
    <form id="arranque-form" class="tarjeta arranque__tarjeta" novalidate>
      <div class="arranque__marca"><svg class="logo logo--lg" aria-hidden="true"><use href="sistema/iconos.svg#marca"/></svg><h1 id="arranque-titulo" data-t="arranque.titulo"></h1></div>
      <p id="arranque-estado" class="grupo-botones" role="status"><span class="cargador" aria-hidden="true"></span><span id="arranque-estado-texto"></span></p>
      <div id="arranque-error" class="aviso-en-linea aviso-en-linea--error" role="alert" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#error"/></svg>
        <div class="pila-mini"><strong id="arranque-error-titulo"></strong><span id="arranque-error-texto"></span>
          <details class="detalles"><summary data-t="comun.verDetalles"></summary><pre id="arranque-error-detalle"></pre></details></div>
      </div>
      <label class="campo"><span class="campo__etiqueta" data-t="arranque.canal"></span>
        <input id="arranque-canal" class="mono" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" aria-describedby="arranque-canal-ayuda" data-icono="red">
        <span class="campo__ayuda" id="arranque-canal-ayuda" data-t="arranque.canalAyuda"></span>
      </label>
      <div id="arranque-recientes" class="grupo-botones"></div>
      <label class="campo"><span class="campo__etiqueta" data-t="arranque.nombre"></span>
        <input id="arranque-nombre" maxlength="63" autocomplete="off" data-t-placeholder="arranque.nombreEjemplo" data-icono="editar">
      </label>
      <button type="submit" id="arranque-abrir" class="btn btn--primario btn--lg" data-t="arranque.abrir" data-icono="flecha-der"></button>
      <p class="suave pequeno" id="arranque-version"></p>
    </form>
  </main>

  <div class="app" id="app" hidden>
    <nav class="nav-lateral" data-t-aria-label="nav.etiqueta">
      <div class="nav-lateral__marca"><svg class="logotipo" role="img" aria-label="Aula"><use href="sistema/iconos.svg#marca-horizontal"/></svg><svg class="logo" role="img" aria-label="Aula"><use href="sistema/iconos.svg#marca"/></svg></div>
      <button type="button" class="nav-lateral__clase" id="nav-clase" data-t-title="nav.cambiarCanal">
        <span class="suave" data-t="nav.claseAbierta"></span>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#flecha-abajo"/></svg>
        <strong id="nav-clase-texto"></strong>
      </button>
      <button type="button" class="nav-lateral__clase-compacta" id="nav-clase-compacta"></button>
      <!-- Terminar la clase (prompt 10.14): bajo el Selector de clase; abre su propio diálogo. -->
      <button type="button" class="nav-lateral__boton nav-lateral__terminar" id="nav-terminar" data-t-title="terminar.ayudaBoton"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#salir"/></svg><span class="nav-lateral__texto" data-t="terminar.boton"></span></button>
      <p class="nav-lateral__grupo" data-t="nav.grupoClase"></p>
      <a href="#alumnos" data-vista="alumnos"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg><span class="nav-lateral__texto" data-t="nav.alumnos"></span></a>
      <a href="#codigo" data-vista="codigo"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#codigo"/></svg><span class="nav-lateral__texto" data-t="nav.codigo"></span></a>
      <a href="#archivos" data-vista="archivos"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#archivo"/></svg><span class="nav-lateral__texto" data-t="nav.archivos"></span></a>
      <a href="#participacion" data-vista="participacion"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#participacion"/></svg><span class="nav-lateral__texto"><span data-t="nav.participacion"></span><span class="solo-lector" id="nav-participacion-lector"></span></span><span class="nav-lateral__contador" id="nav-participacion-contador" aria-hidden="true"></span></a>
      <p class="nav-lateral__grupo" data-t="nav.grupoPruebas"></p>
      <a href="#simulada" data-vista="simulada"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg><span class="nav-lateral__texto" data-t="nav.simulada"></span></a>
      <div class="nav-lateral__pie">
        <a href="#ayuda" data-vista="ayuda"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg><span class="nav-lateral__texto" data-t="nav.ayuda"></span></a>
        <button type="button" class="nav-lateral__boton" id="nav-ajustes"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ajustes"/></svg><span class="nav-lateral__texto" data-t="nav.ajustes"></span></button>
      </div>
    </nav>

    <div class="principal">
      <!-- Franjas globales: visibles en todas las vistas. -->
      <p class="franja franja--transmitiendo" id="f-transmitiendo" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg>
        <span class="franja__texto"><span id="f-transmitiendo-texto"></span> <span class="franja__nota" data-t="transmitir.nota"></span></span>
        <button type="button" class="btn btn--sm" id="f-transmitiendo-detener" data-t="transmitir.detener" data-icono="detener"></button>
      </p>
      <!-- La pantalla de un alumno mostrada a la clase (prompt 12.1), como «Mostrar mi pantalla». -->
      <p class="franja franja--transmitiendo" id="f-proyectando" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg>
        <span class="franja__texto"><span id="f-proyectando-texto"></span> <span class="franja__nota" data-t="proyectar.nota"></span></span>
        <button type="button" class="btn btn--sm" id="f-proyectando-ver" data-t="proyectar.ver" data-icono="ojo"></button>
        <button type="button" class="btn btn--sm" id="f-proyectando-detener" data-icono="detener"></button>
      </p>
      <p class="franja franja--control" id="f-control" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#control"/></svg>
        <span class="franja__texto" id="f-control-texto"></span>
        <button type="button" class="btn btn--sm btn--sobre-color" id="f-control-ver" data-t="control.ver" data-icono="ojo"></button>
        <button type="button" class="btn btn--sm btn--sobre-color" id="f-control-soltar" data-t="control.soltar" data-icono="detener"></button>
      </p>
      <!-- Pantallas en pausa (prompt 10.21): sigue activa mientras la clase corre. -->
      <p class="franja franja--pausa" id="f-pausa" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#pausa"/></svg>
        <span class="franja__texto"><span id="f-pausa-texto"></span> <span class="franja__nota" id="f-pausa-nota"></span></span>
        <button type="button" class="btn btn--sm btn--sobre-color" id="f-pausa-mensaje" aria-haspopup="dialog" aria-controls="dlg-pausa" data-t="pausa.cambiarMensaje" data-icono="editar"></button>
        <button type="button" class="btn btn--sm btn--sobre-color" id="f-pausa-reanudar" data-t="pausa.reanudarTodo" data-icono="reanudar"></button>
      </p>
      <p class="franja franja--energia" id="f-energia" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#energia"/></svg>
        <span class="franja__texto" id="f-energia-texto"></span>
        <button type="button" class="btn btn--sm" id="f-energia-cancelar" data-t="energia.cancelarPendientes" data-icono="cerrar"></button>
      </p>
      <!-- El temporizador sigue mientras corre la clase (prompt 10.8): sin aria-live,
           que leería cada segundo; el inicio y el fin se anuncian con un toast. -->
      <section class="franja franja--temporizador" id="f-temporizador" data-t-aria-label="temporizador.franjaEtiqueta" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#reloj"/></svg>
        <span class="franja__texto"><span class="cuenta" id="f-temporizador-texto"></span> <span class="franja__nota" id="f-temporizador-nota"></span></span>
        <button type="button" class="btn btn--sm" id="f-temporizador-extender" aria-expanded="false" aria-controls="f-temporizador-mas" data-t="temporizador.extender" data-icono="mas"></button>
        <span class="grupo-botones" id="f-temporizador-mas" role="group" data-t-aria-label="temporizador.extenderEtiqueta" hidden>
          <button type="button" class="btn btn--sm" data-extender="60" data-icono="mas"></button>
          <button type="button" class="btn btn--sm" data-extender="300" data-icono="mas"></button>
          <button type="button" class="btn btn--sm" data-extender="600" data-icono="mas"></button>
        </span>
        <button type="button" class="btn btn--sm" id="f-temporizador-detener" data-icono="detener"></button>
      </section>
      <!-- La encuesta abierta (prompt 10.12): sin aria-live, que leería cada respuesta. -->
      <section class="franja franja--encuesta" id="f-encuesta" data-t-aria-label="encuesta.franjaEtiqueta" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#encuesta"/></svg>
        <span class="franja__texto"><span id="f-encuesta-texto"></span> <span class="franja__nota" id="f-encuesta-nota"></span></span>
        <a class="btn btn--sm" href="#participacion" id="f-encuesta-ver" data-t="encuesta.verResultados" data-icono="ojo"></a>
        <button type="button" class="btn btn--sm" id="f-encuesta-cerrar" data-t="encuesta.cerrar" data-icono="detener"></button>
      </section>
      <p class="franja franja--simulada" id="f-simulada" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg>
        <span class="franja__texto"><span id="f-simulada-texto"></span> <span class="franja__nota" data-t="simulada.franjaNota"></span></span>
        <button type="button" class="btn btn--sm" id="f-simulada-salir" data-t="simulada.salir" data-icono="cerrar"></button>
      </p>
      <p class="franja franja--advertencia" id="f-clave" role="status" hidden>
        <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#llave"/></svg>
        <span class="franja__texto" data-t="clave.sinCentro"></span>
        <button type="button" class="btn btn--sm" id="f-clave-que-hago" data-t="clave.queHago" data-icono="ayuda"></button>
      </p>

      <div class="con-panel">
        <main class="vista" id="contenido" tabindex="-1">

          <!-- ============ Alumnos ============ -->
          <section data-vista-de="alumnos" aria-labelledby="h-alumnos" class="vista__seccion">
            <header class="vista__cabecera">
              <h1 id="h-alumnos" data-t="alumnos.titulo"></h1>
              <div class="resumen" id="alumnos-resumen" aria-live="polite"></div>
              <!-- A quién van las acciones (nota de interfaz v0.1.0 006): antes en la barra de acciones. -->
              <span class="insignia insignia--info" id="seleccion-texto" aria-live="polite"><svg class="icono" aria-hidden="true"><use id="seleccion-icono" href="sistema/iconos.svg#alumnos"/></svg><span id="seleccion-corto"></span><span class="solo-lector" id="seleccion-ayuda"></span></span>
              <div class="segmentado" role="group" data-t-aria-label="alumnos.modo">
                <button type="button" data-modo="lista"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#lista"/></svg><span data-t="alumnos.lista"></span></button>
                <button type="button" data-modo="miniaturas"><svg class="icono icono--sm" aria-hidden="true"><use href="sistema/iconos.svg#miniaturas"/></svg><span data-t="alumnos.miniaturas"></span></button>
              </div>
              <!-- Tamaño de las miniaturas (nota de interfaz v0.1.0 004): solo en Miniaturas; se recuerda. -->
              <label class="tamano-miniaturas" id="tamano-miniaturas" hidden><span data-t="alumnos.tamano"></span>
                <select id="tamano-miniaturas-select" class="control" data-icono="miniaturas">
                  <option value="pequeno" data-t="alumnos.tamano.pequeno"></option>
                  <option value="mediano" data-t="alumnos.tamano.mediano"></option>
                  <option value="grande" data-t="alumnos.tamano.grande"></option>
                  <option value="extra" data-t="alumnos.tamano.extra"></option>
                  <option value="ajustar" data-t="alumnos.tamano.ajustar"></option>
                </select></label>
              <!-- Equipos conocidos sin sesión (prompt 10.19): ocultos hasta que se piden; se recuerda. -->
              <label class="opcion" id="alumnos-apagados-campo" hidden><input type="checkbox" class="interruptor" id="alumnos-apagados" role="switch"> <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#energia"/></svg> <span id="alumnos-apagados-texto"></span></label>
              <button type="button" class="btn" id="seleccionar-todos" data-t-title="alumnos.ctrlA"><svg class="icono" aria-hidden="true"><use id="seleccionar-todos-icono" href="sistema/iconos.svg#hecho"/></svg><span class="btn__texto" id="seleccionar-todos-texto"></span></button>
              <a class="btn btn--fantasma" href="#falta"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#persona-buscar"/></svg><span data-t="falta.titulo"></span></a>
              <button type="button" class="btn btn--fantasma btn--icono" data-ayuda-contextual data-t-aria-label="ayuda.contextual" data-t-title="ayuda.contextual"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg></button>
            </header>
            <div class="vista__cuerpo">
              <div id="alumnos-vacio" class="tarjeta vacio" hidden>
                <svg class="icono icono--xl" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg>
                <h2 id="alumnos-vacio-titulo"></h2>
                <p data-t="alumnos.vacioTexto"></p>
                <div class="grupo-botones">
                  <a class="btn btn--primario" href="#falta" data-t="falta.titulo" data-icono="persona-buscar"></a>
                  <button type="button" class="btn" data-abrir-simulada><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#simulado"/></svg><span data-t="simulada.probar"></span></button>
                </div>
              </div>
              <div id="alumnos-lista" class="tabla-adaptable">
                <table class="tabla" data-t-aria-label="alumnos.tablaEtiqueta">
                  <thead><tr>
                    <th class="col-marca"><input type="checkbox" id="alumnos-todos" data-t-aria-label="alumnos.seleccionarTodos"></th>
                    <th data-t="alumnos.colEquipo"></th><th data-t="alumnos.colEstado"></th>
                    <th data-t="alumnos.colCodigo"></th><th class="col-sistema" data-t="alumnos.colSistema"></th><th data-t="alumnos.colNotas"></th>
                    <th class="col-accion"><span class="solo-lector" data-t="alumnos.colFicha"></span></th>
                  </tr></thead>
                  <tbody id="alumnos-filas"></tbody>
                </table>
              </div>
              <div id="alumnos-miniaturas" hidden>
                <p class="aviso-en-linea aviso-en-linea--advertencia"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg><span data-t="alumnos.avisoMiniaturas"></span></p>
                <ul class="cuadricula-alumnos" id="alumnos-cuadricula"></ul>
              </div>
            </div>
            <div class="barra-acciones" role="toolbar" data-t-aria-label="alumnos.barraEtiqueta">
              <div class="barra-acciones__dentro">
                <button type="button" class="btn" data-panel="pantalla" aria-expanded="false" data-t-tip="panel.pantalla"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#transmitir"/></svg><span class="btn__texto" data-t="panel.pantalla"></span></button>
                <button type="button" class="btn" data-panel="aviso" aria-expanded="false" data-t-tip="panel.aviso"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#aviso"/></svg><span class="btn__texto" data-t="panel.aviso"></span></button>
                <button type="button" class="btn" data-panel="pausa" aria-expanded="false" data-t-tip="panel.pausaTip"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#pausa"/></svg><span class="btn__texto" data-t="panel.pausa"></span></button>
                <button type="button" class="btn" data-panel="restricciones" aria-expanded="false" data-t-tip="panel.restricciones"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#candado"/></svg><span class="btn__texto" data-t="panel.restricciones"></span></button>
                <button type="button" class="btn" data-panel="energia" aria-expanded="false" data-t-tip="panel.energia"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#energia"/></svg><span class="btn__texto" data-t="panel.energia"></span></button>
                <button type="button" class="btn" data-panel="captura" aria-expanded="false" data-t-tip="panel.captura"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#captura"/></svg><span class="btn__texto" data-t="panel.captura"></span></button>
                <button type="button" class="btn" data-panel="temporizador" aria-expanded="false" data-t-tip="panel.temporizador"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#reloj"/></svg><span class="btn__texto" data-t="panel.temporizador"></span></button>
                <button type="button" class="btn" data-panel="encuesta" aria-expanded="false" data-t-tip="panel.encuesta"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#encuesta"/></svg><span class="btn__texto" data-t="panel.encuesta"></span></button>
                <button type="button" class="btn" data-panel="abrir" aria-expanded="false" data-t-tip="panel.abrir"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#externo"/></svg><span class="btn__texto" data-t="panel.abrirCorto"></span></button>
              </div>
            </div>
          </section>

          <!-- ============ Código ============ -->
          <section data-vista-de="codigo" aria-labelledby="h-codigo" class="vista__seccion" hidden>
            <header class="vista__cabecera"><h1 id="h-codigo" data-t="codigo.titulo"></h1><button type="button" class="btn btn--fantasma btn--icono" data-ayuda-contextual data-t-aria-label="ayuda.contextual" data-t-title="ayuda.contextual"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#ayuda"/></svg></button></header>
            <div class="vista__cuerpo pila">
              <div class="codigo-rejilla">
                <section class="tarjeta" aria-labelledby="codigo-ejercicio">
                  <div class="tarjeta__cabecera">
                    <h2 id="codigo-ejercicio"></h2>
                    <span class="insignia insignia--info"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#info"/></svg><span data-t="codigo.borrador"></span></span>
                  </div>
                  <div class="tarjeta__cuerpo pila">
                    <div class="fila">
                      <label class="campo crece"><span class="campo__etiqueta"><span data-t="codigo.tituloCampo"></span> <span class="suave" data-t="comun.opcional"></span></span>
                        <input id="codigo-titulo" maxlength="200" data-t-placeholder="codigo.tituloEjemplo" data-icono="editar"></label>
                      <label class="campo"><span class="campo__etiqueta" data-t="codigo.lenguaje"></span><select id="codigo-lenguaje" data-icono="codigo"></select></label>
                    </div>
                    <div id="editor" class="editor" data-t-aria-label="codigo.editor"></div>
                    <p class="pequeno suave" id="codigo-ayuda-teclado"></p>
                    <!-- Pie de envío (notas de interfaz 11 y 14): a quién, y las acciones en una fila, la principal
                         primero, con textos cortos y su explicación en un tooltip. -->
                    <div class="pie-envio">
                      <fieldset class="pie-envio__destino">
                        <legend class="campo__etiqueta" data-t="codigo.enviarA"></legend>
                        <div class="opciones-seg">
                          <label class="opcion-seg"><input type="radio" name="codigo-destino" value="todos" checked> <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#alumnos"/></svg> <span id="codigo-destino-todos"></span></label>
                          <label class="opcion-seg"><input type="radio" name="codigo-destino" value="seleccion" id="codigo-destino-seleccion-radio"> <svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#filtro"/></svg> <span id="codigo-destino-seleccion"></span></label>
                        </div>
                      </fieldset>
                      <div class="pie-envio__acciones pie-envio__acciones--fila">
                        <button type="button" class="btn btn--primario" id="codigo-emitir" data-t-ayuda="codigo.emitirAyuda"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#enviar"/></svg><span data-t="codigo.emitir"></span></button>
                        <button type="button" class="btn" id="codigo-agregar" data-t-ayuda="codigo.agregarAyuda"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#mas"/></svg><span data-t="codigo.agregar"></span></button>
                        <button type="button" class="btn btn--peligro-texto" id="codigo-limpiar" data-t-ayuda="codigo.limpiarAyuda"><svg class="icono" aria-hidden="true"><use href="sistema/iconos.svg#limpiar"/></svg><span data-t="codigo.limpiar"></span></button>
