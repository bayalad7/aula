name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      # Wails on Linux links GTK/WebKitGTK through cgo; Ubuntu 24.04 ships webkit2gtk-4.1.
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "GOFLAGS=-tags=webkit2_41" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  # Walks the teacher console's real frontend in headless Chromium with the
  # bindings faked (scripts/ux): fails on JS errors or serious/critical axe-core
  # violations (WCAG 2.1 AA). The screenshots are kept as an artifact.
  ux:
    name: Consola en el arnés web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/ux/package-lock.json

      # The harness exports the manual with go test ./apps/teacher, which links
      # Wails (GTK/WebKitGTK) like the Go job.
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "GOFLAGS=-tags=webkit2_41" >> "$GITHUB_ENV"

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # needs; allow them instead of running Chromium without a sandbox.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: npm ci
        working-directory: scripts/ux
        run: npm ci

      - name: Recorrido de la consola
        working-directory: scripts/ux
        run: node recorrido.mjs salida

      # Tab through every view (focus never lost, always visible, no traps) and
      # Esc on panels and dialogs (prompt 18, Fase 7.1).
      - name: Recorrido con el teclado
        working-directory: scripts/ux
        run: node teclado.mjs

      # Follow «Primeros pasos» as written: every control the manual names must
      # exist with that label.
      - name: Usuario nuevo (Primeros pasos)
        working-directory: scripts/ux
        run: node usuario-nuevo.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-consola
          path: scripts/ux/salida/
          retention-days: 7

  # Installs a real Windows service (AulaAgentePrueba, never AulaAgente) and runs
  # its lifecycle: install, status, start, crash and automatic restart, stop,
  # uninstall (D-016). The runner is an administrator; the last step deletes the
  # service even if the test fails, so it never stays installed.
  servicio:
    name: Servicio de Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Ciclo del servicio
        env:
          AULA_SERVICE_TEST: '1'
        run: go test -tags servicetest -run TestServiceLifecycle -v ./apps/student/

      # The class restrictions change the machine (NRPT rule, browser
      # policies): only here, as administrator, and undone below.
      - name: Restricciones de la clase (NRPT, directivas y resolvedor)
        env:
          AULA_ADMIN_TEST: '1'
        # -p 1: both packages touch the same NRPT; in parallel they would see
        # each other's rule.
        run: go test -p 1 -tags admintest -run Admin -v ./internal/platform/ ./internal/policy/

      - name: Quitar las reglas NRPT de prueba
        if: always()
        shell: pwsh
        run: |
          Get-DnsClientNrptRule | Where-Object { $_.Comment -eq 'aula-filtro-web' } | ForEach-Object { Remove-DnsClientNrptRule -Name $_.Name -Force }
          if (Get-DnsClientNrptRule | Where-Object { $_.Comment -eq 'aula-filtro-web' }) { throw "quedaron reglas NRPT de Aula" }

      - name: Desinstalar el servicio de prueba
        if: always()
        shell: pwsh
        run: |
          sc.exe stop AulaAgentePrueba | Out-Null
          sc.exe delete AulaAgentePrueba | Out-Null
          if (Get-Service AulaAgentePrueba -ErrorAction SilentlyContinue) {
            Start-Sleep -Seconds 5
            if (Get-Service AulaAgentePrueba -ErrorAction SilentlyContinue) { throw "AulaAgentePrueba sigue instalado" }
          }
          exit 0
