name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      # Wails on Linux links GTK/WebKitGTK through cgo; Ubuntu 24.04 ships webkit2gtk-4.1.
      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          echo "GOFLAGS=-tags=webkit2_41" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: go test -race
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  # Installs a real Windows service (AulaAgentePrueba, never AulaAgente) and runs
  # its lifecycle: install, status, start, crash and automatic restart, stop,
  # uninstall (D-016). The runner is an administrator; the last step deletes the
  # service even if the test fails, so it never stays installed.
  servicio:
    name: Servicio de Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Ciclo del servicio
        env:
          AULA_SERVICE_TEST: '1'
        run: go test -tags servicetest -run TestServiceLifecycle -v ./apps/student/

      - name: Desinstalar el servicio de prueba
        if: always()
        shell: pwsh
        run: |
          sc.exe stop AulaAgentePrueba | Out-Null
          sc.exe delete AulaAgentePrueba | Out-Null
          if (Get-Service AulaAgentePrueba -ErrorAction SilentlyContinue) {
            Start-Sleep -Seconds 5
            if (Get-Service AulaAgentePrueba -ErrorAction SilentlyContinue) { throw "AulaAgentePrueba sigue instalado" }
          }
          exit 0
